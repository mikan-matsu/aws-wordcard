version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 20 && nvm use 20
        - npm install
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://www.googletagmanager.com https://*.adtrafficquality.google; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.appsync-api.ap-northeast-1.amazonaws.com https://*.amazonaws.com https://*.amazoncognito.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googlesyndication.com https://*.g.doubleclick.net https://*.adtrafficquality.google; img-src 'self' data: https:; font-src 'self' data:; frame-src https://*.amazoncognito.com https://*.googlesyndication.com https://*.g.doubleclick.net https://*.google.com https://*.adtrafficquality.google;"
