name: CI

# Production deploys are done by Amplify Hosting on every push to main (amplify.yml).
# This workflow verifies changes before they reach main, and merges Dependabot PRs
# that pass (the merge itself triggers the Amplify build).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Same install command as the Amplify production build.
      - run: npm install
      # amplify_outputs.json is generated by Amplify at deploy time and not committed;
      # build against placeholder values (AppSync is mocked in the E2E tests).
      - run: cp test/fixtures/ci-amplify-outputs.json amplify_outputs.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  dependabot-automerge:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.html_url }}" --squash --delete-branch
